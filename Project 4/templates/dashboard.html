{% extends "base.html" %}

{% block title %}Welcome - Mama's Mamta{% endblock %}

{% block content %}
<div class="landing-full">
    <!-- Header Navigation -->
    <header class="landing-header">
        <h2>Mama's Mamta</h2>
        <div class="landing-nav">
            <a href="{{ url_for('login') }}" class="nav-link">Login</a>
            <a href="{{ url_for('register') }}" class="btn-signup">Sign Up</a>
        </div>
    </header>

    <!-- Main Hero Section -->
    <main class="hero-section">
        <!-- Left Side: Typography -->
        <div class="hero-text">
            <h1>Search Recipes, Scale Ingredients,<br>Find Best Prices.</h1>
            <h2>Make Your Perfect Meal.</h2>
        </div>

        <!-- Right Side: Image Slider -->
        <div class="hero-slider">
            <div class="slide-track" id="sliderTrack">
                <!-- Just the 4 original images -->
                <img src="https://images.unsplash.com/photo-1585937421612-70a008356fbe?q=80&w=600&auto=format&fit=crop" alt="Indian Thali">
                <img src="https://images.unsplash.com/photo-1561336313-0bd5e0b27ec8?q=80&w=600&auto=format&fit=crop" alt="Masala Chai">
                <img src="https://images.unsplash.com/photo-1631515243349-e0cb75fb8d3a?q=80&w=600&auto=format&fit=crop" alt="Biryani">
                <img src="https://images.unsplash.com/photo-1497935586351-b67a49e012bf?q=80&w=600&auto=format&fit=crop" alt="Coffee">
            </div>
        </div>
    </main>
</div>

<script>
    const track = document.getElementById('sliderTrack');
    const images = track.querySelectorAll('img');
    const imageWidth = 500; // Matches your CSS width
    let currentIndex = 0;

    setInterval(() => {
        currentIndex++;
        
        // If we reach the end, reset back to the first image
        if (currentIndex >= images.length) {
            currentIndex = 0;
        }

        // Move the track to the left by the width of the images
        track.style.transform = `translateX(-${currentIndex * imageWidth}px)`;
    }, 7000); // 10000 milliseconds = 10 seconds
</script>
{% endblock %}
