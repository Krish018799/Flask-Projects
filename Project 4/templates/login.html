{% extends "base.html" %}

{% block title %}Login - Mama's Mamta{% endblock %}

{% block content %}
<div class="card">
    <h2>Mama's Mamta</h2>
    <p>Login to find your perfect meal.</p>

    <!-- Form action points to your Flask login function -->
    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn">Login</button>
    </form>

    <div class="links">
        <!-- Dynamically linking to the register route -->
        <a href="{{ url_for('register') }}">Don't have an account? Sign Up</a>
    </div>
</div>
{% endblock %}
